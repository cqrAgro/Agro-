name: Atualizar cotação do boi

on:
  schedule:
    # 12:00 UTC ~= 09:00 em Brasília (UTC-3), de segunda a sábado.
    # Ajuste o horário se o site atualizar em outro momento do dia.
    - cron: "0 12 * * 1-6"
  workflow_dispatch: {}   # permite rodar manualmente pelo GitHub também

permissions:
  contents: write   # necessário pra ele conseguir commitar o histórico atualizado

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar scraper
        run: python scrape_boi.py

      - name: Salvar alterações no repositório
        run: |
          git config user.name "bot-cotacao-boi"
          git config user.email "bot@users.noreply.github.com"
          git add data/historico.json
          git diff --staged --quiet || git commit -m "Atualiza cotação do boi $(date +%d-%m-%Y)"
          git push
